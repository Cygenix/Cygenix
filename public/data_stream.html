<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/auth-gate.js?v=8053f04e2e"></script>
<script src="/cygenix-auth-token.js?v=8ed8e00fad" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- The two weights the first paint needs. Without these the browser only
       discovers the fonts after the stylesheet has arrived and been parsed, so
       text paints in a fallback face and swaps a moment later. -->
  <link rel="preload" href="/fonts/noto-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/noto-sans-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/cygenix-console.css">
<link rel="stylesheet" href="/cygenix-theme.css">
<link rel="stylesheet" href="/cygenix-icons.css">
<link rel="stylesheet" href="/cygenix-mobile.css">
<link rel="stylesheet" href="/cygenix-datastream.css">
<script>
(function(){
  try {
    var p = JSON.parse(localStorage.getItem('cygenix_app_prefs') || '{}');
    var t = p.theme || 'light';
    if (!p.themeOracleMigrated) {
      if (t === 'dark') { t = 'light'; p.theme = 'light'; }
      p.themeOracleMigrated = true;
      try { localStorage.setItem('cygenix_app_prefs', JSON.stringify(p)); } catch(_e){}
    }
    if (t === 'auto') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (_) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Feed another datasource continuously from source or target, as changes are found.">
<title>Cygenix – Data Stream</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* The console palette lives in cygenix-console.css. Only what is this
     page's own is declared here. */
}
body{font-family:var(--serif);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding-left:216px;transition:padding-left 0.2s ease}
body.cyg-collapsed{padding-left:54px}
.page{padding:1rem 1.25rem;max-width:100%}
.panel{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.panel-header{display:flex;align-items:center;gap:0.6rem;padding:0.7rem 0.9rem;border-bottom:0.5px solid var(--border);flex-wrap:wrap}
.panel-title{font-size:12px;font-weight:600;letter-spacing:0.02em}
.panel-sub{font-size:11px;color:var(--text3)}
.panel-fold{border:0.5px solid var(--border2);background:var(--bg3);color:var(--text3);cursor:pointer;
  border-radius:5px;font-size:13px;line-height:1;padding:3px 7px;flex:none;font-family:var(--serif)}
.panel-fold:hover{color:var(--accent);border-color:rgba(74,91,214,0.35)}
.btn{font-size:11.5px;padding:5px 11px;border-radius:6px;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);font-family:var(--serif);white-space:nowrap;display:inline-flex;align-items:center;gap:0.35rem}
.btn:hover{color:var(--accent);border-color:rgba(74,91,214,0.35)}
.btn:disabled{opacity:0.45;cursor:default}
.btn.on{color:var(--accent);border-color:rgba(74,91,214,0.45);background:var(--accent-glow)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{color:#fff;opacity:0.9}
.ds-select{font-family:var(--serif);font-size:12.5px;font-weight:500;padding:0.42rem 2rem 0.42rem 0.7rem;
  border-radius:8px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);cursor:pointer;
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 10px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.ds-select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ds-list-wrap{max-height:calc(100vh - 250px);overflow:auto}
</style>
</head>
<body>
<div id="cyg-sidebar-mount" data-active="data-stream"></div>

<div class="page">
<div id="cyg-subnav-mount"></div>
  <div class="ds-head">
    <div>
      <div class="ds-title"><i class="ic ic-stream"></i> Data Stream</div>
      <div class="ds-sub">Feed another datasource continuously from source or target, as changes are found.</div>
    </div>

    <!-- The same set of streams, told three ways. Flow is the one that
         explains the module without words, so it is not buried. -->
    <div class="ds-viewsel">
      <span class="ds-viewsel-lbl" id="ds-viewlbl">View</span>
      <select id="ds-view" class="ds-select" aria-labelledby="ds-viewlbl" onchange="dsSetView(this.value)">
        <option value="table">Streams</option>
        <option value="store">Store</option>
        <option value="flow">Flow</option>
      </select>
    </div>

    <div class="ds-head-actions">
      <!-- Global pause. A labelled switch rather than a bare icon: an
           operator reaching for this during an incident should not have to
           work out which way "on" points. The label states the real state,
           including a mixed one — see dsPaintGlobalSwitch(). -->
      <div class="ds-globalswitch" id="ds-globalswitch"></div>
      <button class="btn btn-primary" id="ds-new" onclick="dsNewStream()"><i class="ic ic-plus"></i> New stream</button>
      <button class="btn" onclick="dsRefresh()" title="Re-read the streams for this project"><i class="ic ic-sync"></i> Refresh</button>
      <button class="btn" onclick="CygenixDataStreamPage.paletteOpen()" title="Search streams and tables">
        <i class="ic ic-search"></i> Search <span style="font-family:var(--mono);opacity:0.6">⌘K</span></button>
    </div>
  </div>

  <!-- Blocked streams, in plain sentences, above everything. A stream that
       is not delivering must not be able to look like one that is. -->
  <div id="ds-bandhost"></div>
  <!-- Unassigned streams, one line, in This-profile view only. A pointer to
       the streams the view is not showing, not an alarm. -->
  <div id="ds-slimhost"></div>

  <!-- KPI strip. Each tile is a filter, because a figure you cannot act on
       is decoration. -->
  <div class="ds-kpis" id="ds-kpis"></div>

  <div class="ds-filters" id="ds-filters"></div>

  <div class="ds-grid" id="ds-grid">
    <div class="panel" id="ds-main-panel">
      <div class="panel-header">
        <div class="panel-title" id="ds-main-title">Streams</div>
        <span class="panel-sub" id="ds-main-sub"></span>
      </div>
      <div class="ds-list-wrap" id="ds-main"></div>
    </div>

    <div class="panel ds-insp" id="ds-insp">
      <div class="panel-header">
        <div class="panel-title" id="ds-insp-title">Nothing selected</div>
        <button class="panel-fold" style="margin-left:auto" onclick="dsToggleInspector()"
                id="ds-fold" title="Hide the inspector" aria-label="Hide the inspector">❯</button>
      </div>
      <div id="ds-insp-inner"></div>
    </div>
  </div>
</div>

<!-- ⌘K -->
<div class="ds-palette" id="ds-palette" role="dialog" aria-modal="true" aria-label="Search streams and tables"
     onclick="if(event.target===this)CygenixDataStreamPage.paletteClose()">
  <div class="ds-palette-box">
    <input class="ds-palette-input" id="ds-palette-input" type="text" placeholder="Search streams and tables…"
           oninput="CygenixDataStreamPage.paletteFilter()" onkeydown="CygenixDataStreamPage.paletteKey(event)"
           aria-controls="ds-palette-list">
    <div class="ds-palette-list" id="ds-palette-list" role="listbox"></div>
  </div>
</div>

<!-- Replay -->
<div class="ds-modal" id="ds-replay" role="dialog" aria-modal="true" aria-labelledby="ds-replay-title">
  <div class="ds-modal-card">
    <div class="ds-modal-head" id="ds-replay-title">Replay from…</div>
    <div class="ds-modal-body" id="ds-replay-body"></div>
    <div class="ds-modal-foot">
      <button class="btn" onclick="dsCloseReplay()">Cancel</button>
      <button class="btn btn-primary" id="ds-replay-go" onclick="dsDoReplay()">Replay</button>
    </div>
  </div>
</div>

<!-- Assign to profile. A stream belongs to exactly one profile and reads one
     side of it; this is where an existing (unassigned) stream is given both.
     A mismatch between the server the stream was saved against and the
     profile's connection is WARNED, not refused — the person can see both
     names and the engine cannot know which is right. -->
<div class="ds-modal" id="ds-assign" role="dialog" aria-modal="true" aria-labelledby="ds-assign-title">
  <div class="ds-modal-card">
    <div class="ds-modal-head" id="ds-assign-title">Assign to profile</div>
    <div class="ds-modal-body" id="ds-assign-body"></div>
    <div class="ds-modal-foot">
      <button class="btn" onclick="dsCloseAssign()">Cancel</button>
      <button class="btn btn-primary" id="ds-assign-go" onclick="dsDoAssign()">Assign</button>
    </div>
  </div>
</div>

<!-- Global pause. The dialog is the feature: pausing replication is not
     free, and the cost is a deadline nobody was shown. -->
<div class="ds-modal" id="ds-pauseall" role="dialog" aria-modal="true" aria-labelledby="ds-pauseall-title">
  <div class="ds-modal-card">
    <div class="ds-modal-head" id="ds-pauseall-title">Pause all streams</div>
    <div class="ds-modal-body" id="ds-pauseall-body"></div>
    <div class="ds-modal-foot">
      <button class="btn" id="ds-pauseall-cancel" onclick="dsClosePauseAll()">Cancel</button>
      <button class="btn btn-danger" id="ds-pauseall-go" onclick="dsDoPauseAll()">Pause all streams</button>
    </div>
  </div>
</div>

<div class="ds-modal" id="ds-resumeall" role="dialog" aria-modal="true" aria-labelledby="ds-resumeall-title">
  <div class="ds-modal-card">
    <div class="ds-modal-head" id="ds-resumeall-title">Resume streams</div>
    <div class="ds-modal-body" id="ds-resumeall-body"></div>
    <div class="ds-modal-foot">
      <button class="btn" id="ds-resumeall-cancel" onclick="dsCloseResumeAll()">Cancel</button>
      <button class="btn btn-primary" id="ds-resumeall-go" onclick="dsDoResumeAll()">Resume streams</button>
    </div>
  </div>
</div>

<div id="ds-live" class="sr-only" role="status" aria-live="polite"></div>

<script src="/cygenix-capabilities.js?v=0526488864" defer></script>
<script src="/cygenix-status-hairline.js?v=619bb8ede1" defer></script>
<script src="/cygenix-sidebar.js?v=59031b2cdc" defer></script>
  <!-- The audit recorder. Loaded wherever a recordable action can happen,
       which on these pages is every stream lifecycle change. -->
  <script src="/cygenix-audit.js?v=a02ee52051" defer></script>
<script src="/cygenix-job-profile.js?v=d1c87b2e27" defer></script>
<script src="/connections.js?v=3e4823fa6a" defer></script>
<!-- One answer to "what am I connected to?": the active profile first, the
     live pair next, the legacy fields last, and ONE composer for the Function
     App URL, so its access parameter can never be appended twice (the 401). -->
<script src="/cygenix-active-conn.js?v=2db3d77de1" defer></script>
<!-- The local half of the saved-connection credential store: the secret for a
     saved connection lives here, never in the synced list. Loaded wherever
     connections.js is, so the profile plan can see a credential this browser
     already has instead of warning that it is missing. -->
<script src="/cygenix-saved-conn-secrets.js?v=5d5b969ce6" defer></script>
<!-- Connection profiles, and the module that copies the selected profile's two
     connections into the live settings. Without these two the page reads
     whatever Connections last held, which after a profile switch is the wrong
     pair or nothing at all. tests/profile-apply.test.js pins that every page
     loading connections.js also loads these. -->
<script src="/cygenix-profiles.js?v=dc0206fcd9" defer></script>
<script src="/cygenix-profile-apply.js?v=2928c2fb5a" defer></script>
<script src="/cygenix-datastream.js?v=cf1b2702f0" defer></script>
<script src="/cygenix-datastream-ui.js?v=a0e01de431" defer></script>
<script src="/cygenix-datastream-page.js?v=2c3f580800" defer></script>
<script src="/data-stream-app.js?v=202b19afd3" defer></script>
<script src="/cygenix-busy.js?v=5b8f3d8384"></script>
<!-- Assistant — docked side panel, present on every app screen -->
<script src="/cygenix-model.js?v=0c71915777"></script>
<script src="/cygenix-page-reader.js?v=42e45abb62"></script>
<script src="/cygenix-assistant.js?v=7f823e8353"></script>
<script src="/cygenix-assistant-actions.js?v=bc221fcede"></script>
<script src="/cygenix-tour-state.js?v=9e44c36131"></script>
<script src="/cygenix-tour-steps.js?v=e74ac47365"></script>
<script src="/cygenix-tour.js?v=3aa5b94223"></script>
<script>CygenixAssistant.registerPage('data-stream');</script>
</body>
</html>

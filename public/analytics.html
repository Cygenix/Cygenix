<script>
(function(){
  try {
    var p = JSON.parse(localStorage.getItem('cygenix_app_prefs') || '{}');
    var t = p.theme || 'light';
    if (!p.themeOracleMigrated) {
      if (t === 'dark') { t = 'light'; p.theme = 'light'; }
      p.themeOracleMigrated = true;
      try { localStorage.setItem('cygenix_app_prefs', JSON.stringify(p)); } catch(_e){}
    }
    if (t === 'auto') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (_) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Analytics — the lens over Connect→Cutover.

   WHY THIS PAGE EXISTS
   Home had become half landing page and half analysis, and the two halves
   disagreed: TOTAL JOBS and the job-status ring were literally the same
   expression rendered twice, and the Analysed / SQL Generated tiles counted
   across all projects while the pipeline strip beside them counted the active
   one. Those are two true numbers that look like one fact. The analytical
   material lives here now; Home keeps the alert band, Projects, Schedules and
   Project Status, and one readiness figure that links through.

   EVERY NUMBER IS DERIVED IN ONE PLACE
   cygenix-analytics.js — pure, node-requirable, unit-tested against fixtures.
   This page reads localStorage, hands the shapes in, and renders view models.
   Nothing on this screen does its own arithmetic.

   READ-ONLY, ON PURPOSE
   Analytics surfaces and links; the fix always happens on the screen that owns
   it. Every tile, bar and row is a way into Data Stream, Jobs, Data Quality or
   Projects. There is no control here that changes a production system.

   ON THE COLOURS
   Tokens only, from cygenix-theme.css. Status is never carried by colour
   alone: every pill has a word in it, and every sparkline has a text
   alternative beside it.
   ═══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--serif);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding-left:230px;transition:padding-left 0.2s ease}
body.cyg-collapsed{padding-left:54px}

.page{padding:1.5rem 2rem;max-width:1420px}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:600;letter-spacing:-0.01em;margin-bottom:0.25rem}
.page-sub{font-size:12px;color:var(--text3);max-width:820px;line-height:1.55}
.an-controls{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap}

.panel{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r-lg);margin-bottom:1rem}
.panel-head{padding:0.7rem 1rem;border-bottom:0.5px solid var(--border);display:flex;align-items:baseline;justify-content:space-between;gap:0.6rem;flex-wrap:wrap}
.panel-title{font-size:13px;font-weight:600;color:var(--text)}
.panel-sub{font-size:11px;color:var(--text3);margin-top:1px}
.panel-body{padding:0.9rem 1rem}
.panel-foot{border-top:0.5px solid var(--border);padding:0.5rem 1rem;font-size:10.5px;color:var(--text3);display:flex;justify-content:space-between;gap:0.6rem;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;padding:0.4rem 0.875rem;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);font-family:var(--serif);transition:all 0.15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--bg3);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{opacity:0.9;background:var(--accent);color:#fff}
.btn-sm{padding:0.22rem 0.6rem;font-size:11px}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.form-input{background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--r);padding:0.38rem 0.6rem;font-size:12px;color:var(--text);font-family:var(--serif);outline:none}
.form-input:focus{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ── Tabs ──────────────────────────────────────────────────────────────────
   The .cx-tabs bar the console already uses (reports, balancing, system
   parameters), plus the ARIA the others never got: role=tab, aria-selected,
   a roving tabindex and arrow keys. Copying the look without the semantics
   would have shipped a fourth inaccessible tab bar. */
.cx-tabs{display:flex;gap:0;margin-bottom:1.25rem;border-bottom:0.5px solid var(--border);flex-wrap:wrap}
.cx-tab{background:transparent;border:none;color:var(--text3);font-family:var(--serif);font-size:12px;font-weight:500;padding:0.6rem 1.1rem;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;margin-bottom:-0.5px;text-align:left}
.cx-tab:hover{color:var(--text2)}
.cx-tab-active{color:var(--accent);border-bottom-color:var(--accent)}
.cx-tab small{display:block;font-size:10px;color:var(--text3);font-weight:400;margin-top:1px}
.cx-tab-active small{color:var(--accent);opacity:0.8}

/* ── KPI strip ─────────────────────────────────────────────────────────── */
.an-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0.5px;background:var(--border);border:0.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:1rem}
.an-kpi{background:var(--bg2);padding:0.7rem 0.9rem 0.8rem;min-width:0}
.an-kpi-label{font-size:9.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3)}
.an-kpi-val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.15;margin-top:3px;color:var(--text)}
.an-kpi-val em{font-style:normal;font-size:12px;color:var(--text3);font-weight:500;margin-left:2px}
.an-kpi-sub{font-size:10.5px;color:var(--text3);margin-top:3px;line-height:1.45}
.an-kpi-alert{box-shadow:inset 3px 0 0 var(--red)}
.an-kpi-warn{box-shadow:inset 3px 0 0 var(--amber)}
.an-kpi a{color:var(--accent);text-decoration:none}
.an-kpi a:hover{text-decoration:underline}

/* ── Pills. Always a word, never only a colour. ───────────────────────── */
.an-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;letter-spacing:0.03em;padding:2px 7px;border-radius:11px;white-space:nowrap}
.an-pill-good{background:var(--green-bg);color:var(--green)}
.an-pill-warn{background:var(--amber-bg);color:var(--amber)}
.an-pill-crit{background:var(--red-bg);color:var(--red)}
.an-pill-info{background:var(--teal-bg);color:var(--teal)}
.an-pill-mute{background:var(--bg3);color:var(--text3)}

/* ── Grids ─────────────────────────────────────────────────────────────── */
.an-cols-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;align-items:start}
@media (max-width:1100px){ .an-cols-2{grid-template-columns:1fr} }

/* ── Tables ────────────────────────────────────────────────────────────── */
.an-tblwrap{overflow-x:auto}
.an-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.an-tbl th{text-align:left;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);font-weight:600;padding:0 0.6rem 0.4rem;border-bottom:0.5px solid var(--border);white-space:nowrap}
.an-tbl td{padding:0.45rem 0.6rem;border-bottom:0.5px solid var(--border);vertical-align:middle}
.an-tbl tbody tr:last-child td{border-bottom:0}
.an-tbl tbody tr:hover{background:var(--bg3)}
.an-tbl .num,.an-tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.an-obj{font-family:var(--mono);font-size:11px;color:var(--text)}
.an-tbl a{color:var(--accent);text-decoration:none}
.an-tbl a:hover{text-decoration:underline}

/* ── Bars, sparklines, heatmap ─────────────────────────────────────────── */
.an-bar-row{display:grid;grid-template-columns:150px 1fr 54px;gap:0.6rem;align-items:center;padding:0.25rem 0}
.an-bar-track{height:14px;background:var(--bg3);border-radius:0 3px 3px 0}
.an-bar-fill{height:14px;border-radius:0 4px 4px 0;background:var(--accent)}
.an-bar-val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;text-align:right;color:var(--text2)}
.an-spark{color:var(--accent);vertical-align:middle}
.an-factor{display:grid;grid-template-columns:1fr 74px;gap:0.6rem;align-items:center;padding:0.45rem 0;border-top:0.5px solid var(--border)}
.an-factor:first-child{border-top:0}
.an-factor-name{font-size:11.5px;font-weight:500;color:var(--text)}
.an-factor-note{font-size:10px;color:var(--text3);margin-top:2px}
.an-factor-track{height:4px;border-radius:2px;background:var(--bg4);margin:4px 0 3px}
.an-factor-fill{height:4px;border-radius:2px}
.an-factor-pts{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-size:11.5px;font-weight:600;color:var(--text2)}
.an-heat{border-collapse:separate;border-spacing:2px;font-size:10px}
.an-heat th{font-size:9px;color:var(--text3);font-weight:600;text-align:left;padding-right:0.5rem;white-space:nowrap}
.an-heat td{width:14px;height:14px;border-radius:2px;background:var(--bg3)}
.an-heat td.miss{background:transparent;border:0.5px dashed var(--border)}

/* ── Migration pipeline card ───────────────────────────────────────────────
   Moved here verbatim from dashboard.html with the renderer it styles. The
   stage chips, the bottleneck flag and the narrative line are the same
   component that was on Home; only its address changed. */
.mp-panel{padding:1rem 1.15rem}
.mp-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:0.85rem;flex-wrap:wrap}
.mp-title{font-size:13px;font-weight:600;color:var(--text)}
.mp-sub{font-size:11px;color:var(--text3)}
.mp-asof{font-size:10.5px;color:var(--text3);font-family:var(--mono);display:flex;align-items:center;gap:0.4rem}
.mp-asof button{background:transparent;border:none;color:var(--text3);cursor:pointer;font:inherit;padding:2px 5px;border-radius:5px}
.mp-asof button:hover{background:var(--hover-tint,rgba(22,26,32,0.04));color:var(--text)}
.mp-row{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;overflow-x:auto;padding:0.2rem 0}
.mp-stage{flex:1 1 0;min-width:128px;background:var(--bg3);border:0.5px solid var(--border2);
  border-radius:var(--r);padding:0.6rem 0.7rem;text-decoration:none;color:inherit;display:block;
  transition:border-color 0.12s,background 0.12s}
.mp-stage:hover{border-color:var(--accent);background:var(--bg2)}
.mp-stage-key{font-size:9.5px;letter-spacing:0.08em;color:var(--text3);font-family:var(--mono);
  text-transform:uppercase;margin-bottom:4px}
.mp-stage-count{font-size:13px;font-weight:600;color:var(--text)}
.mp-stage-detail{font-size:10.5px;color:var(--text3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Every state carries a word. Colour is the second signal, never the only
   one — with colour ignored these still read correctly. */
.mp-state{display:inline-block;margin-top:6px;font-size:9.5px;font-family:var(--mono);
  letter-spacing:0.05em;padding:1px 6px;border-radius:100px}
.mp-state-done{color:var(--green);background:var(--green-bg)}
.mp-state-active{color:var(--accent);background:var(--accent-glow)}
.mp-state-attention{color:var(--amber);background:var(--amber-bg)}
.mp-state-blocked{color:var(--red);background:var(--red-bg)}
.mp-state-waiting{color:var(--text3);background:var(--bg4)}
.mp-stage.is-attention{border-left:3px solid var(--amber)}
.mp-stage.is-blocked{border-left:3px solid var(--red)}
.mp-stage.is-done{background:var(--green-bg);border-color:rgba(63,125,78,0.28)}
.mp-arrow{flex:0 0 56px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--text3);padding:0 0.25rem}
.mp-arrow-label{font-family:var(--mono);font-size:9.5px;white-space:nowrap}
.mp-arrow-line{width:100%;height:1px;background:currentColor;position:relative}
.mp-arrow-line::after{content:'';position:absolute;right:-1px;top:-3px;border-left:6px solid currentColor;
  border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.mp-arrow.hot{color:var(--amber)}
.mp-bottleneck{font-size:9.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.06em;
  margin-top:5px;display:inline-block;padding:1px 6px;border-radius:100px}
.mp-bottleneck.amber{color:var(--amber);background:var(--amber-bg)}
.mp-bottleneck.red{color:var(--red);background:var(--red-bg)}
.mp-narrative{margin-top:0.9rem;padding-top:0.8rem;border-top:0.5px solid var(--border);
  display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.mp-narrative-text{font-size:13px;line-height:1.6;color:var(--text);max-width:70ch;flex:1 1 320px}
.mp-narrative-src{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:0.3rem}
.mp-cta{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap;font-weight:500}
.mp-cta:hover{text-decoration:underline}
/* Under ~720px the row becomes a column and the arrows become a left rail. */
@media (max-width:720px){
  .mp-row{flex-direction:column;overflow-x:visible}
  .mp-stage{min-width:0}
  .mp-arrow{flex:0 0 auto;height:22px;width:100%;flex-direction:row}
  .mp-arrow-line{width:1px;height:100%;margin-left:1.1rem}
  .mp-arrow-line::after{right:-3px;top:auto;bottom:-1px;border-left:3.5px solid transparent;
    border-right:3.5px solid transparent;border-top:6px solid currentColor;border-bottom:none}
}

/* Confidence breakdown — the arithmetic, not just the components. */
.mp-conf-row{display:flex;align-items:baseline;justify-content:space-between;gap:0.75rem;
  padding:5px 0;border-bottom:0.5px solid var(--border);font-size:12px}
.mp-conf-row:last-of-type{border-bottom:none}
.mp-conf-pts{font-family:var(--mono);font-size:12px;white-space:nowrap}
.mp-conf-sum{font-family:var(--mono);font-size:11px;color:var(--text3);padding-top:8px;line-height:1.7}
.mp-conf-fix{color:var(--accent);text-decoration:none;font-size:11px;margin-left:0.5rem}
.mp-conf-fix:hover{text-decoration:underline}

/* ── Progress ──────────────────────────────────────────────────────────── */
.an-prog{display:flex;align-items:center;gap:0.45rem}
.an-prog-track{flex:1;height:5px;border-radius:3px;background:var(--bg4);min-width:60px}
.an-prog-fill{height:5px;border-radius:3px;background:var(--accent)}
.an-prog-pct{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:10.5px;width:30px;text-align:right;color:var(--text2)}

/* ── Empty states. Three lines, matching dashboard.html, rather than
       pulling a second convention onto the page. ─────────────────────── */
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text3)}
.empty-state h3{font-size:13.5px;color:var(--text2);margin-bottom:0.35rem;font-weight:500}
.empty-state p{font-size:12px;line-height:1.65;max-width:520px;margin:0 auto}
.empty-state a{color:var(--accent);text-decoration:none}

/* A caveat that belongs beside a number rather than instead of it: the figure
   is real, its history is not, and the reader has to know which. */
.an-caveat{font-size:10.5px;color:var(--text3);line-height:1.55;border-left:2px solid var(--border2);padding-left:0.6rem;margin-top:0.6rem}

.an-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── Print: the tab IS the client pack ─────────────────────────────────── */
@media print{
  body{padding-left:0;background:#fff}
  #cyg-sidebar-mount,.an-controls,.cx-tabs{display:none !important}
  .page{padding:0.5rem;max-width:none}
  .panel{break-inside:avoid}
}
</style>
</head>

<div class="page">

  <div class="page-header">
    <div>
      <div class="page-title"><i class="ic ic-chart"></i> Analytics</div>
      <div class="page-sub">Telemetry across every job, stream and project. Read-only —

    </button>
    <button class="cx-tab" role="tab" id="an-tab-quality" aria-selected="false"
            aria-controls="an-panel-quality" tabindex="-1" data-an-tab="quality">
      Quality<small>are the checks passing</small>
    </button>
    <button class="cx-tab" role="tab" id="an-tab-portfolio" aria-selected="false"
            aria-controls="an-panel-portfolio" tabindex="-1" data-an-tab="portfolio">
      Portfolio<small>every client, one view</small>
    </button>
  </div>

  <section id="an-panel-delivery" role="tabpanel" aria-labelledby="an-tab-delivery" tabindex="0"></section>
  <section id="an-panel-quality"  role="tabpanel" aria-labelledby="an-tab-quality"  tabindex="0" hidden></section>
  <section id="an-panel-portfolio" role="tabpanel" aria-labelledby="an-tab-portfolio" tabindex="0" hidden></section>

<!-- The derivation, then the engines it reads, then the page that renders them.
     cygenix-analytics.js owns every figure; the datastream pair supplies the
     blocked band, the sparkline helpers and the live stream state; preflight
     and pipeline supply the readiness score and the lifecycle stages, which is
     the same arithmetic Home shows so the two can never disagree. -->
<!-- The pipeline's Connect stage asks whether a source and a target are set,
     and that answer lives in CygenixConnections. Without this module the stage
     reads "0 of 2 connected" on every project — a confident wrong answer, and
     one that makes Connect the bottleneck on a project that is fully wired. -->
  <!-- The audit recorder. Loaded wherever a recordable action can happen,
       which is anywhere connections can be saved, edited or deleted. -->
  <script src="/cygenix-audit.js?v=a02ee52051" defer></script>

<!-- Assistant — docked side panel, present on every app screen -->

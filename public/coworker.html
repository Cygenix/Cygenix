<!DOCTYPE html>

<link rel="stylesheet" href="/cygenix-icons.css">
<link rel="stylesheet" href="/cygenix-mobile.css">
<script>
(function(){
  try {
    var p = JSON.parse(localStorage.getItem('cygenix_app_prefs') || '{}');
    var t = p.theme || 'light';
    if (t === 'auto') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (_) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
<meta name="robots" content="noindex">
<title>Cygenix – Assistant</title>
<style>
  body{font-family:var(--serif,system-ui,sans-serif);background:var(--bg);color:var(--text);
    display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .note{max-width:420px;text-align:center;font-size:13.5px;line-height:1.65;color:var(--text2);padding:1rem}
  .note b{color:var(--text)}
</style>
<!-- Accessibility engine: re-applies the visitor's saved text size and
     high-contrast choice. Without it here, a setting turned on elsewhere in
     the product silently disappears on this page. -->
<script src="/cygenix-a11y.js?v=a64ca52904" defer></script>
</head>
<body>
<!-- ══════════════════════════════════════════════════════════════════════
     AI Workspace was replaced by the docked Assistant panel, which lives on
     every app screen (Ctrl+/ or the launcher button). This page remains only
     to catch old links and to carry the Workspace's saved artifacts over:

       · saved SCRIPTS  → the SQL Editor's script library (via the Drive)
       · saved DOCUMENTS → the Drive, under "Co-Worker documents"
       · an unsaved artifact still on the canvas → migrated too

     The migration runs once (cygenix_coworker_migrated_v1), then every visit
     just redirects. #drive deep-links land on the Drive overlay.
     ══════════════════════════════════════════════════════════════════════ -->
<div class="note">
  <b>AI Workspace is now the Assistant panel.</b><br>
  It lives on every screen — press <b>Ctrl+/</b> or use the launcher, bottom right.
  Moving your saved items to the Drive…
</div>
<script src="/cygenix-drive.js?v=43733ac277"></script>
<script>
(async function () {
  'use strict';
  var FLAG = 'cygenix_coworker_migrated_v1';
  var LIB_KEY = 'cygenix_coworker_artifacts_v1';
  var SESSION_KEY = 'cygenix_coworker_session_v1';

  function go() {
    var dest = /#drive\b/.test(location.hash || '') ? '/dashboard#drive' : '/dashboard#assistant';
    location.replace(dest);
  }

  try {
    if (!localStorage.getItem(FLAG) && window.CygenixDrive) {
      var items = [];
      try { items = JSON.parse(localStorage.getItem(LIB_KEY) || '[]') || []; } catch (e) { items = []; }
      // The artifact still open on the canvas counts too — losing an unsaved
      // draft to a redesign is exactly the kind of thing users remember.
      try {
        var sess = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
        var art = sess && sess.artifact;
        if (art && art.content && String(art.content).trim()) {
          items.unshift({ id: 'live', type: art.type || 'script',
            name: art.name || 'Unsaved artifact', content: art.content, ts: Date.now() });
        }
      } catch (e) { /* no live session */ }

      var docsFolder = null;
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (!it || !it.content) continue;
        try {
          if (it.type === 'document') {
            if (!docsFolder) docsFolder = await CygenixDrive.ensureFolderPath('', ['Co-Worker documents']);
            await CygenixDrive.addFile(docsFolder,
              CygenixDrive.safeName(it.name || 'Document') + '.md', it.content, 'text/markdown');
          } else {
            // Scripts go where scripts live: the SQL Editor's library.
            await CygenixDrive.upsertScript({
              id: 'coworker_' + (it.id || i),
              name: it.name || 'Co-Worker script',
              sql: it.content,
              desc: 'Migrated from AI Workspace',
            });
          }
        } catch (e) { /* one bad artifact must not block the rest */ }
      }
      localStorage.setItem(FLAG, '1');
    }
  } catch (e) { /* migration is best-effort; the library keys are left intact */ }
  go();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/auth-gate.js?v=8053f04e2e"></script>
<script src="/cygenix-auth-token.js?v=8ed8e00fad" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- The two weights the first paint needs. Without these the browser only
       discovers the fonts after the stylesheet has arrived and been parsed, so
       text paints in a fallback face and swaps a moment later. -->
  <link rel="preload" href="/fonts/noto-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/noto-sans-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/cygenix-console.css">
<link rel="stylesheet" href="/cygenix-theme.css">
<link rel="stylesheet" href="/cygenix-icons.css">
<link rel="stylesheet" href="/cygenix-mobile.css">
<link rel="stylesheet" href="/cygenix-datastream.css">
<script>
(function(){
  try {
    var p = JSON.parse(localStorage.getItem('cygenix_app_prefs') || '{}');
    var t = p.theme || 'light';
    if (!p.themeOracleMigrated) {
      if (t === 'dark') { t = 'light'; p.theme = 'light'; }
      p.themeOracleMigrated = true;
      try { localStorage.setItem('cygenix_app_prefs', JSON.stringify(p)); } catch(_e){}
    }
    if (t === 'auto') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (_) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Every change record captured, in order, with what happened to it.">
<title>Cygenix – Change Events</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* The console palette lives in cygenix-console.css. Only what is this
     page's own is declared here. */
}
body{font-family:var(--serif);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding-left:216px;transition:padding-left 0.2s ease}
body.cyg-collapsed{padding-left:54px}
.page{padding:1rem 1.25rem;max-width:100%}
.panel{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.panel-header{display:flex;align-items:center;gap:0.6rem;padding:0.7rem 0.9rem;border-bottom:0.5px solid var(--border);flex-wrap:wrap}
.panel-title{font-size:12px;font-weight:600;letter-spacing:0.02em}
.panel-sub{font-size:11px;color:var(--text3)}
.btn{font-size:11.5px;padding:5px 11px;border-radius:6px;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);font-family:var(--serif);white-space:nowrap;display:inline-flex;align-items:center;gap:0.35rem}
.btn:hover{color:var(--accent);border-color:rgba(74,91,214,0.35)}
.btn:disabled{opacity:0.45;cursor:default}
.btn.on{color:var(--accent);border-color:rgba(74,91,214,0.45);background:var(--accent-glow)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{color:#fff;opacity:0.9}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ds-tail-wrap{max-height:calc(100vh - 235px);overflow:auto}
.ds-ts{font-family:var(--mono);font-size:10.5px;color:var(--text3);white-space:nowrap}
</style>
</head>
<body>
<div id="cyg-sidebar-mount" data-active="data-stream-events"></div>

<div class="page">
<div id="cyg-subnav-mount"></div>
  <div class="ds-head">
    <div>
      <div class="ds-title"><i class="ic ic-bolt"></i> Change Events</div>
      <div class="ds-sub">Every change record captured, in order, with what happened to it.</div>
    </div>
    <div class="ds-head-actions">
      <button class="btn" id="ds-tail-btn" onclick="dsToggleTail()"><i class="ic ic-pause"></i> Pause tail</button>
      <button class="btn" onclick="dsExport()"><i class="ic ic-download"></i> Export view</button>
      <button class="btn" onclick="CygenixDataStreamPage.paletteOpen()" title="Search streams and tables">
        <i class="ic ic-search"></i> Search <span style="font-family:var(--mono);opacity:0.6">⌘K</span></button>
    </div>
  </div>

  <div class="ds-filters" id="ds-filters"></div>

  <div class="panel" id="ds-dlq-summary" style="display:none;margin-bottom:0.6rem"></div>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-title" id="ds-tail-title">Live tail</div>
      <span class="panel-sub" id="ds-tail-sub"></span>
      <div style="margin-left:auto;display:flex;gap:0.4rem">
        <button class="btn" onclick="dsOpenReplay()"><i class="ic ic-undo"></i> Replay from…</button>
        <button class="btn" id="ds-requeue-btn" onclick="dsRequeueSelected()" style="display:none"></button>
      </div>
    </div>
    <button class="ds-buffered" id="ds-buffered" style="display:none" onclick="dsResumeTail()"></button>
    <div class="ds-tail-wrap" id="ds-tail"></div>
  </div>
</div>

<!-- Event detail -->
<div class="ds-drawer" id="ds-drawer" role="dialog" aria-modal="true" aria-labelledby="ds-drawer-title">
  <div class="ds-drawer-head">
    <div style="min-width:0">
      <div class="panel-title" id="ds-drawer-title">Change record</div>
      <div class="panel-sub" id="ds-drawer-sub"></div>
    </div>
    <button class="btn" style="margin-left:auto" onclick="dsCloseDrawer()" aria-label="Close">✕</button>
  </div>
  <div class="ds-drawer-body" id="ds-drawer-body"></div>
  <div class="ds-drawer-foot" id="ds-drawer-foot"></div>
</div>

<!-- Replay -->
<div class="ds-modal" id="ds-replay" role="dialog" aria-modal="true" aria-labelledby="ds-replay-title">
  <div class="ds-modal-card">
    <div class="ds-modal-head" id="ds-replay-title">Replay from…</div>
    <div class="ds-modal-body" id="ds-replay-body"></div>
    <div class="ds-modal-foot">
      <button class="btn" onclick="dsCloseReplay()">Cancel</button>
      <button class="btn btn-primary" onclick="dsDoReplay()">Replay</button>
    </div>
  </div>
</div>

<!-- ⌘K -->
<div class="ds-palette" id="ds-palette" role="dialog" aria-modal="true" aria-label="Search streams and tables"
     onclick="if(event.target===this)CygenixDataStreamPage.paletteClose()">
  <div class="ds-palette-box">
    <input class="ds-palette-input" id="ds-palette-input" type="text" placeholder="Search streams and tables…"
           oninput="CygenixDataStreamPage.paletteFilter()" onkeydown="CygenixDataStreamPage.paletteKey(event)"
           aria-controls="ds-palette-list">
    <div class="ds-palette-list" id="ds-palette-list" role="listbox"></div>
  </div>
</div>

<div id="ds-live" class="sr-only" role="status" aria-live="polite"></div>

<script src="/cygenix-capabilities.js?v=0526488864" defer></script>
<script src="/cygenix-status-hairline.js?v=619bb8ede1" defer></script>
<script src="/cygenix-sidebar.js?v=59031b2cdc" defer></script>
  <!-- The audit recorder. Loaded wherever a recordable action can happen,
       which on these pages is every stream lifecycle change. -->
  <script src="/cygenix-audit.js?v=a02ee52051" defer></script>
<script src="/cygenix-job-profile.js?v=d1c87b2e27" defer></script>
<script src="/connections.js?v=3e4823fa6a" defer></script>
<!-- One answer to "what am I connected to?": the active profile first, the
     live pair next, the legacy fields last, and ONE composer for the Function
     App URL, so its access parameter can never be appended twice (the 401). -->
<script src="/cygenix-active-conn.js?v=2db3d77de1" defer></script>
<!-- The local half of the saved-connection credential store: the secret for a
     saved connection lives here, never in the synced list. Loaded wherever
     connections.js is, so the profile plan can see a credential this browser
     already has instead of warning that it is missing. -->
<script src="/cygenix-saved-conn-secrets.js?v=5d5b969ce6" defer></script>
<!-- Connection profiles, and the module that copies the selected profile's two
     connections into the live settings. Without these two the page reads
     whatever Connections last held, which after a profile switch is the wrong
     pair or nothing at all. tests/profile-apply.test.js pins that every page
     loading connections.js also loads these. -->
<script src="/cygenix-profiles.js?v=dc0206fcd9" defer></script>
<script src="/cygenix-profile-apply.js?v=2928c2fb5a" defer></script>
<script src="/cygenix-datastream.js?v=cf1b2702f0" defer></script>
<script src="/cygenix-datastream-ui.js?v=a0e01de431" defer></script>
<script src="/cygenix-datastream-page.js?v=2c3f580800" defer></script>
<script src="/data-stream-events-app.js?v=2a910593f3" defer></script>
<script src="/cygenix-busy.js?v=5b8f3d8384"></script>
<!-- Assistant — docked side panel, present on every app screen -->
<script src="/cygenix-model.js?v=0c71915777"></script>
<script src="/cygenix-page-reader.js?v=42e45abb62"></script>
<script src="/cygenix-assistant.js?v=7f823e8353"></script>
<script src="/cygenix-assistant-actions.js?v=bc221fcede"></script>
<script src="/cygenix-tour-state.js?v=9e44c36131"></script>
<script src="/cygenix-tour-steps.js?v=e74ac47365"></script>
<script src="/cygenix-tour.js?v=3aa5b94223"></script>
<script>CygenixAssistant.registerPage('data-stream-events');</script>
</body>
</html>

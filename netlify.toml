[build]
  publish = "public"
  functions = "netlify/functions"
  # stamp-assets rewrites every local <script src> to carry a content hash,
  # so a deployed change is fetched immediately instead of sitting behind a
  # cached copy of the same URL. Running it at build time means a deploy can
  # never ship stamps that disagree with the files.
  # check-env runs FIRST and WARNS, in the build log, about missing
  # configuration that would otherwise deploy cleanly and then break all
  # persistence — which is what happened for three weeks when
  # CYGENIX_DATA_FN_KEY was unset. It does not fail the build: its first
  # version did, and blocked every deploy for two days when the variable was
  # set in a scope the build could not see. CYGENIX_ENFORCE_ENV=true opts
  # into the hard gate.
  command = "npm install && node scripts/check-env.js && node scripts/stamp-assets.js && node scripts/build-routes.js"
[[edge_functions]]
  path = "/api/analyse"
  function = "analyse"
[[edge_functions]]
  path = "/api/coworker"
  function = "coworker"
# Page routing — the root, the clean extensionless addresses and the legacy
# redirects — all live in public/_redirects, generated by
# scripts/build-routes.js. Only the API proxies are declared here.

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
[[redirects]]
  from = "/api/db"
  to = "/.netlify/functions/db-connect"
  status = 200
[[redirects]]
  from = "/api/create-checkout-session"
  to = "https://cygenix-db-api-e4fng7a4edhydzc4.uksouth-01.azurewebsites.net/api/create-checkout-session"
  status = 200
  force = true

[functions]
  # nodemailer resolves its transports and its punycode/iconv data at runtime,
  # which esbuild cannot follow — bundling it produces a function that throws
  # on the first sendMail. Shipping it as a plain node_module instead.
  external_node_modules = ["nodemailer"]

[functions."scheduled-runner"]
  schedule = "* * * * *"

# Audit retention. Nightly, deliberately not on the hour: retention is
# measured in days so the exact minute is irrelevant, and a run that collided
# with the scheduler's busiest tick would contend for the same blob store for
# no reason. Each run is budgeted and idempotent — a backlog is worked down
# over successive nights, not attempted in one pass.
[functions."audit-retention"]
  schedule = "17 3 * * *"

# ── Security headers ─────────────────────────────────────────────────────────
# There were none of these until the security section went up, and a section
# that talks about transport while the response carries no headers is the kind
# of thing the reader checks first. These are the safe set — each one is a
# statement the browser enforces, and none of them can break a page that was
# already working:
#
#   HSTS                    Netlify already redirects to HTTPS; this stops the
#                           first request of a later visit ever being plaintext.
#                           No preload directive: preloading is close to
#                           irreversible and is not a decision to make in a
#                           header nobody reviewed.
#   X-Content-Type-Options  Stop the browser guessing a type we did not send.
#   X-Frame-Options         No page here is ever framed — there is not one
#                           <iframe> in public/ — so DENY costs nothing and
#                           removes clickjacking entirely.
#   Referrer-Policy         A console URL can carry a project id. Send the
#                           origin off-site, never the path.
#   Permissions-Policy      Turn off the capabilities this product never uses,
#                           so a compromised script cannot reach for them.
#
# NOT set, deliberately: Content-Security-Policy. Every page in public/ carries
# inline <style> and <script> by design, so a real policy needs either
# 'unsafe-inline' — which is a policy that permits the thing it exists to stop —
# or a nonce on several hundred inline blocks. That is a project, not a header,
# and shipping the weak version would be a claim without a control behind it.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

# ── Caching ──────────────────────────────────────────────────────────────────
# Scripts referenced from HTML carry ?v=<content hash> (scripts/stamp-assets.js),
# so a changed file always has a changed URL: these numbers only ever apply to a
# file that has NOT changed, and a new build is fetched the moment the
# always-revalidated HTML points somewhere new.
#
# The window still stays modest because scripts injected at RUNTIME by other
# scripts (the sidebar's lazy Drive modal) have no tag to stamp and rely on
# these headers alone. A day of stale-while-revalidate meant a fix in one of
# those could take a day to arrive; ten minutes bounds it.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"
# The favicon rarely changes and is requested on every page.
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
# HTML must always be revalidated so navigations get the latest page (and any
# prefetch stores the current version).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

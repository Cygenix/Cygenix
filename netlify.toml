[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"
[[edge_functions]]
  path = "/api/analyse"
  function = "analyse"
[[edge_functions]]
  path = "/api/coworker"
  function = "coworker"
# Project Planner was removed. A bookmark or an old link should land
# somewhere useful rather than on a 404.
[[redirects]]
  from = "/project-plan.html"
  to = "/dashboard.html"
  status = 301

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
[[redirects]]
  from = "/api/db"
  to = "/.netlify/functions/db-connect"
  status = 200
[[redirects]]
  from = "/api/create-checkout-session"
  to = "https://cygenix-db-api-e4fng7a4edhydzc4.uksouth-01.azurewebsites.net/api/create-checkout-session"
  status = 200
  force = true

[functions]
  # nodemailer resolves its transports and its punycode/iconv data at runtime,
  # which esbuild cannot follow — bundling it produces a function that throws
  # on the first sendMail. Shipping it as a plain node_module instead.
  external_node_modules = ["nodemailer"]

[functions."scheduled-runner"]
  schedule = "* * * * *"

# ── Caching ──────────────────────────────────────────────────────────────────
# Shared scripts/styles are re-used across every page. max-age=300 plus a day
# of stale-while-revalidate: dashboard alone loads ~20 scripts, and at the old
# max-age=30 any navigation more than 30s after the last one revalidated every
# single one. SWR serves from cache instantly and refreshes in the background,
# so a deploy is still picked up on the first navigation after the window.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
# The favicon rarely changes and is requested on every page.
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
# HTML must always be revalidated so navigations get the latest page (and any
# prefetch stores the current version).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
